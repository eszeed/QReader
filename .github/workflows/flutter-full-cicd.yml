name: QReader 全平台 CI/CD

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

env:
  FLUTTER_CHANNEL: stable

jobs:
  # ──────────────────────────────────────────────
  #  任务1：代码检查 + 单元测试（所有推送 / PR 均运行）
  # ──────────────────────────────────────────────
  test-lint:
    name: 代码检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      - name: 代码格式校验
        run: dart format --set-exit-if-changed .

      - name: 静态分析
        run: flutter analyze --fatal-infos

      - name: 单元测试
        run: flutter test --coverage

  # ──────────────────────────────────────────────
  #  任务2-8：全平台构建（仅 tag 推送时触发，并行执行）
  # ──────────────────────────────────────────────

  # Android APK
  build-android:
    name: Android 构建
    needs: test-lint
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: 提取版本号
        id: version
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')" >> $GITHUB_OUTPUT
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: QReader-${{ steps.version.outputs.version }}-android-arm64-v8a.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Web
  build-web:
    name: Web 构建
    needs: test-lint
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: 提取版本号
        id: version
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')" >> $GITHUB_OUTPUT
      - run: flutter build web --release
      - name: 打包 Web 产物
        run: zip -r QReader-${{ steps.version.outputs.version }}-web.zip build/web
      - uses: actions/upload-artifact@v4
        with:
          name: QReader-${{ steps.version.outputs.version }}-web.zip
          path: QReader-${{ steps.version.outputs.version }}-web.zip

  # Windows
  build-windows:
    name: Windows 构建
    needs: test-lint
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: 提取版本号
        id: version
        shell: bash
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')" >> $GITHUB_OUTPUT
      - run: flutter build windows --release
      - name: 压缩 Windows 产物
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\release\* -DestinationPath QReader-${{ steps.version.outputs.version }}-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QReader-${{ steps.version.outputs.version }}-windows-x64.zip
          path: QReader-${{ steps.version.outputs.version }}-windows-x64.zip

  # Linux
  build-linux:
    name: Linux 构建
    needs: test-lint
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: 安装 Linux 编译依赖
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - name: 提取版本号
        id: version
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')" >> $GITHUB_OUTPUT
      - run: flutter build linux --release
      - name: 打包 Linux 产物
        run: zip -r QReader-${{ steps.version.outputs.version }}-linux-x64.zip build/linux/x64/release/bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: QReader-${{ steps.version.outputs.version }}-linux-x64.zip
          path: QReader-${{ steps.version.outputs.version }}-linux-x64.zip

  # iOS（需要 ios 目录，当前项目未配置则自动跳过）
  build-ios:
    name: iOS 构建
    needs: test-lint
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') && hashFiles('ios/') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: 提取版本号
        id: version
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')" >> $GITHUB_OUTPUT
      - name: 安装 iOS Pod 依赖
        run: cd ios && pod install --repo-update
      - run: flutter build ios --release --no-codesign
      - name: 打包 iOS 产物
        run: zip -r QReader-${{ steps.version.outputs.version }}-ios.zip build/ios/iphoneos/Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: QReader-${{ steps.version.outputs.version }}-ios.zip
          path: QReader-${{ steps.version.outputs.version }}-ios.zip

  # macOS（需要 macos 目录，当前项目未配置则自动跳过）
  build-macos:
    name: macOS 构建
    needs: test-lint
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') && hashFiles('macos/') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: 提取版本号
        id: version
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')" >> $GITHUB_OUTPUT
      - run: flutter build macos --release
      - name: 打包 macOS 产物
        run: zip -r QReader-${{ steps.version.outputs.version }}-macos.zip build/macos/Build/Products/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: QReader-${{ steps.version.outputs.version }}-macos.zip
          path: QReader-${{ steps.version.outputs.version }}-macos.zip

  # ──────────────────────────────────────────────
  #  任务9：创建 GitHub Release 并上传所有产物
  # ──────────────────────────────────────────────
  release:
    name: 发布版本
    needs: [ build-android, build-web, build-windows, build-linux ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 提取版本号
        id: version
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')" >> $GITHUB_OUTPUT

      - name: 提取 Git Tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 查看产物目录
        run: ls -R artifacts

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: QReader ${{ steps.version.outputs.version }}
          body: |
            ## QReader ${{ steps.version.outputs.version }}

            ### 下载

            | 平台 | 文件 |
            |------|------|
            | 🤖 Android | `.apk` |
            | 🌐 Web | `.zip` |
            | 🪟 Windows | `.zip` |
            | 🐧 Linux | `.zip` |

            ---
            *由 GitHub Actions 自动构建发布*
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
